name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04  # Playwright 1.57 has no browsers for 26.04 yet
    strategy:
      matrix:
        java: ['25', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        # the desktop app's UI tests build real windows: give them a virtual display
        run: xvfb-run -a mvn -B package
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-tests/package-lock.json
      - name: Web app browser tests
        working-directory: web-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-tests-report-java${{ matrix.java }}
          path: web-tests/playwright-report/
          if-no-files-found: ignore
